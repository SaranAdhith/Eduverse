  - {id: T0.1, tier: T0, name: "Syntax & program structure",            prerequisites: [],            core: true}
  - {id: T0.2, tier: T0, name: "Variables & data types",                prerequisites: [T0.1],        core: true}
  - {id: T0.3, tier: T0, name: "Operators & expressions",               prerequisites: [T0.2],        core: true}
  - {id: T0.4, tier: T0, name: "Input/output & string formatting",      prerequisites: [T0.2],        core: true}
