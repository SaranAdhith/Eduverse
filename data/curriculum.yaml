# Eduverse curriculum knowledge graph
# Source: DOC_00 section 1. Each topic lists its DIRECT prerequisites by ID.
# This is the DAG the path planner walks; a student is not routed to a topic
# until every prerequisite shows mastery above threshold.

tiers:
  T0: {name: "Foundations"}
  T1: {name: "Control flow"}
  T2: {name: "Core data structures"}
  T3: {name: "Functions"}
  T4: {name: "Modules & error handling"}
  T5: {name: "Object-oriented programming"}
  T6: {name: "Advanced language features"}
  T7: {name: "Concurrency & async"}
  T8: {name: "Tooling"}

# Topics flagged `core: false` are the easiest scope cuts (DOC_00 sections 0 & 7):
# the T6.6 stretch topic and the entire T7/T8 tiers. Everything else is core.

topics:
