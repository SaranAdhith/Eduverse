#   tier  items  anchors                difficulty mix
#   T0    3      T0.2, T0.3             easy 2, medium 1
#   T1    3      T1.1, T1.2             easy 1, medium 2
#   T2    4      T2.2, T2.4, T2.6       easy 1, medium 2, hard 1
#   T3    4      T3.1, T3.5, T3.6       medium 2, hard 2
#   T4    3      T4.3, T4.5             medium 2, hard 1
