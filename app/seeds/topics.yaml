# DOC_02 §2 — topic catalog. Mirrors DOC_00 §1 (src/eduverse/data/curriculum.yaml).
#
# 47 topics across tiers 0..8. `tier` is the integer tier; `display_order` is the
# stable within-tier ordering (matches the topic id suffix). Topics with
# is_core=false are the scope cuts (T6.6 stretch + all of T7/T8), per DOC_00 §§0,7.
#
# NOTE: DOC_00 prose says "48 topics" but its tier tables enumerate 47; per
# DOC_02's "topic table is the source of truth" rule, 47 is canonical.

- id: T0.1
  tier: 0
  name: "Syntax & program structure"
  slug: syntax-and-program-structure
  description: >
    How a Python program is written and run: statements, indentation as block
    structure, comments, and the read-eval flow of the interpreter.
  display_order: 1
  is_core: true

- id: T0.2
  tier: 0
  name: "Variables & data types"
  slug: variables-and-data-types
  description: >
    Binding names to values and the built-in scalar types (int, float, str,
    bool, None), including dynamic typing and object identity basics.
  display_order: 2
  is_core: true

- id: T0.3
  tier: 0
  name: "Operators & expressions"
  slug: operators-and-expressions
  description: >
    Arithmetic, comparison, logical, and bitwise operators, operator precedence,
    and how expressions evaluate to values.
  display_order: 3
  is_core: true

- id: T0.4
  tier: 0
  name: "Input/output & string formatting"
  slug: input-output-and-string-formatting
  description: >
    Reading input and printing output, plus string formatting with f-strings,
    str.format, and format specifiers.
  display_order: 4
  is_core: true

- id: T0.5
  tier: 0
  name: "Type conversion"
  slug: type-conversion
  description: >
    Explicit and implicit conversion between types (int, float, str, bool) and
    the pitfalls of coercion.
  display_order: 5
  is_core: true

- id: T1.1
  tier: 1
  name: "Conditionals (if/elif/else)"
  slug: conditionals
  description: >
    Branching with if/elif/else, truthiness, comparison chaining, and the
