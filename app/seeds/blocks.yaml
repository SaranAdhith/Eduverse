# DOC_05 §6 — study block assignment.
#
# The study runs two blocks per participant under different modes (personalized
# vs fixed). Each block is a coherent, roughly independent slice of the core
# curriculum. Planners restrict their decisions to a block's topics; a topic's
# out-of-block prerequisites are treated as pre-mastered (T0/T1 foundations are
# shared and covered by the diagnostic, so they appear in no block and are never
# re-taught). Only *core* topics are listed — T6.6 (metaclasses) and all of
# T7/T8 are scope cuts (is_core=false) and are not taught in the study.
#
# DOC_08 wires block assignment into actual participant flows; the split here is
# the canonical default. Keep each block internally prerequisite-closed where
# possible so its topological order is meaningful.

# Block A — "data & functional" track: data structures -> functions -> advanced
# language features. Internal chain T2 -> T3 -> T6.
A:
  - T2.1
  - T2.2
  - T2.3
  - T2.4
  - T2.5
  - T2.6
  - T3.1
  - T3.2
  - T3.3
  - T3.4
  - T3.5
  - T3.6
  - T6.1
  - T6.2
  - T6.3
  - T6.4
  - T6.5

# Block B — "modules & OOP" track: modules/error handling -> object-oriented
# programming. (T5's function prerequisites live in Block A and are assumed
# pre-mastered per §6.)
B:
  - T4.1
  - T4.2
  - T4.3
  - T4.4
  - T4.5
  - T5.1
  - T5.2
  - T5.3
  - T5.4
  - T5.5
  - T5.6
  - T5.7
